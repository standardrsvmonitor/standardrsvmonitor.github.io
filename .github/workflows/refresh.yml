name: Refresh monitor

on:
  schedule:
    - cron: "*/5 * * * *"    # GitHub drops and delays scheduled runs, so offer many; the age check below decides whether to rebuild
  workflow_dispatch:
    inputs:
      tick:
        description: "Set by the scheduler: behave like a scheduled run (age gate, one history snapshot a day)"
        required: false
        default: "0"

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
  actions: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      run: ${{ steps.chk.outputs.run }}
      first: ${{ steps.chk.outputs.first }}
    steps:
      - name: Rebuild unless the live page is younger than 30 minutes
        id: chk
        run: |
          # run=1  -> pull, build and deploy (manual dispatch always runs; scheduled runs and scheduler ticks when the page is 25+ minutes old)
          # first=1 -> this is the first build of the UTC day (or a manual run), so the daily history snapshot is committed
          PAGE=$(curl -fsS "https://standardrsvmonitor.github.io/?t=$(date +%s)" || true)
          STAMP=$(printf '%s' "$PAGE" | grep -o -E 'compiled [0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2} UTC' | head -1 | sed 's/compiled //; s/ UTC//')
          if [ -n "$STAMP" ]; then AGE=$(( ( $(date -u +%s) - $(date -u -d "$STAMP" +%s) ) / 60 )); else AGE=99999; fi
          echo "live page stamp '${STAMP}' age ${AGE} min"
          FIRST=0; case "$STAMP" in "$(date -u +%F)"*) ;; *) FIRST=1 ;; esac
          MANUAL=0; if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.tick }}" != "1" ]; then MANUAL=1; fi   # scheduler ticks behave like the schedule
          if [ "$MANUAL" = "1" ]; then FIRST=1; fi
          if [ "$MANUAL" = "1" ] || [ "$AGE" -ge 25 ]; then RUN=1; else RUN=0; echo "page is fresh, skipping"; fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"; echo "first=$FIRST" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.chk.outputs.run == '1'
      - uses: actions/setup-python@v5
        if: steps.chk.outputs.run == '1'
        with:
          python-version: "3.12"
      - name: Restore incremental caches
        if: steps.chk.outputs.run == '1'
        uses: actions/cache@v4
        with:
          path: data/cache
          key: sr-cache-${{ github.run_id }}
          restore-keys: |
            sr-cache-
      - name: Pull on-chain and indexer data
        if: steps.chk.outputs.run == '1'
        run: python -I pull.py
      - name: Build page
        if: steps.chk.outputs.run == '1'
        run: python -I build.py
      - name: Check the page before it is published (qa/check.py; a failure keeps the last good page up)
        id: gate
        if: steps.chk.outputs.run == '1'
        run: |
          mkdir -p site/api qa/out
          python -I qa/render.py index.html qa/out/render.json --api site/api
          python -I qa/check.py qa/out/render.json data/dash.json --live https://standardrsvmonitor.github.io/ --accept qa/accept.json --api site/api
      - name: Keep the gate report and the compiled data for review
        if: always() && steps.chk.outputs.run == '1'
        run: cp data/dash.json qa/out/dash.json 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always() && steps.chk.outputs.run == '1'
        with:
          name: qa-report
          path: qa/out
          retention-days: 14
      - name: Open, update or close the qa-gate issue
        if: always() && steps.chk.outputs.run == '1' && (steps.gate.outcome == 'failure' || steps.gate.outcome == 'success')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create qa-gate --color B60205 --description "The deploy gate is failing; the page is held at its last good compile" 2>/dev/null || true
          N=$(gh issue list --label qa-gate --state open --json number --jq '.[0].number // empty')
          if [ "${{ steps.gate.outcome }}" = "failure" ]; then
            printf '%s\n\nRun: %s/%s/actions/runs/%s\n' "$(cat qa/out/report.md)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > qa/out/issue.md
            if [ -z "$N" ]; then
              gh issue create --title "Deploy gate failing, page held at the last good compile" --label qa-gate --body-file qa/out/issue.md
              # a new incident starts the agent once, so a fix is on its way before anyone has read the issue
              gh workflow run evolve.yml -f task="The deploy gate is failing and the page is held at its last good compile. The open qa-gate issue has the report. Diagnose the failing check, fix the cause, and open a pull request. If the check itself is wrong, fix the check and say so." || echo "agent dispatch failed"
            else gh issue edit "$N" --body-file qa/out/issue.md; fi
          elif [ -n "$N" ]; then
            gh issue close "$N" --comment "Gate passed at $(date -u +'%Y-%m-%d %H:%M') UTC; the page is current again."
          fi
      - name: Stage site
        if: steps.chk.outputs.run == '1'
        run: cp index.html site/index.html && mkdir -p site/assets && cp assets/reserve-dam.webp site/assets/
      - uses: actions/upload-pages-artifact@v3
        if: steps.chk.outputs.run == '1'
        with:
          path: site
      - name: Commit daily snapshot history (first build of the day or manual run)
        if: steps.chk.outputs.run == '1' && steps.chk.outputs.first == '1'
        continue-on-error: true
        run: |
          git config user.name "sr-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "data: snapshot $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break || sleep 10; done
          fi

  deploy:
    needs: build
    if: needs.build.outputs.run == '1'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
